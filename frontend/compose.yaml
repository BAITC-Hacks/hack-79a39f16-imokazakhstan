name: wind-forecast

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${DASHBOARD_PORT:-8080}:8080'
    environment:
      DASHBOARD_DATA_MODE: '${DASHBOARD_DATA_MODE:-demo}'
      DASHBOARD_API_UPSTREAM: '${DASHBOARD_API_UPSTREAM:-}'
      DASHBOARD_BACKEND_URL: '${DASHBOARD_BACKEND_URL:-}'
      DASHBOARD_DNS_RESOLVER: '${DASHBOARD_DNS_RESOLVER:-127.0.0.11}'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    profiles: [backend]
    build:
      context: ..
      dockerfile: frontend/Dockerfile.backend
    ports:
      - '${STREAMLIT_PORT:-8501}:8501'
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
